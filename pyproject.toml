[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markdown-viewer"
version = "0.1.0"
description = "Super simple markdown viewer with Github styling"
requires-python = ">=3.7"
dependencies = ["markdown>=3.4.0", "watchfiles>=0.18.0", "Pygments>=2.0.0"]

[project.scripts]
mdview = "md_viewer:main"
